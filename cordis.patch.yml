# Inserts only this plugin's own row.
#
# The forwarder listens on 127.0.0.1:port and is the only component that leaves
# through the configured proxy. A provider route points at it through its own
# baseURL, which stays in the provider profile: dsh-llm-pi-ai can only mount once,
# so a route cannot be owned by this bundle.
- insert:
    - id: provider-tunnel
      name: 'dsh-plugin-provider-tunnel'
      config:
        port: 8787
        proxy: 127.0.0.1:7897
        modelIds: []
